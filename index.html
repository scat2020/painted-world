<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Painted World · 水粉到油画的日落漫步</title>
<style>
  html,body{margin:0;padding:0;height:100%;overflow:hidden;background:#1a1626;font-family:"Georgia","Songti SC",serif;}
  #app{position:fixed;inset:0;}
  canvas{display:block;}
  .hud{position:fixed;left:24px;top:22px;color:#f5ead8;pointer-events:none;z-index:10;text-shadow:0 1px 6px rgba(0,0,0,.55);}
  .hud h1{font-size:20px;margin:0 0 6px;letter-spacing:2px;font-weight:600;}
  .hud p{font-size:12.5px;margin:2px 0;opacity:.85;line-height:1.6;}
  .stage{position:fixed;right:26px;top:24px;color:#f5ead8;text-align:right;z-index:10;pointer-events:none;text-shadow:0 1px 6px rgba(0,0,0,.55);}
  .stage .name{font-size:18px;letter-spacing:3px;}
  .stage .medium{font-size:12px;opacity:.8;margin-top:4px;}
  .bar{position:fixed;left:50%;bottom:26px;transform:translateX(-50%);width:min(520px,70vw);z-index:10;}
  .bar .track{height:4px;background:rgba(245,234,216,.25);border-radius:2px;overflow:hidden;}
  .bar .fill{height:100%;width:0%;background:linear-gradient(90deg,#9ec9e8,#f6c17a,#e8734f);border-radius:2px;}
  .bar .labels{display:flex;justify-content:space-between;font-size:11px;color:#f5ead8;opacity:.8;margin-top:6px;letter-spacing:1px;}
  .steps{position:fixed;left:24px;bottom:24px;z-index:10;color:#f5ead8;font-size:11.5px;line-height:1.7;opacity:.75;max-width:300px;text-shadow:0 1px 4px rgba(0,0,0,.5);}
  .steps b{letter-spacing:1px;}
  .hint{position:fixed;right:26px;bottom:24px;color:#f5ead8;font-size:11px;opacity:.7;z-index:10;text-align:right;line-height:1.7;}
  kbd{background:rgba(245,234,216,.15);border:1px solid rgba(245,234,216,.3);border-radius:4px;padding:0 5px;font-size:10px;}
</style>
</head>
<body>
<div id="app"></div>

<div class="hud">
  <h1>PAINTED WORLD</h1>
  <p>森林小径 → 开阔山坡 → 海边日落</p>
  <p>纯代码生成地形 / 植被 / 道具，无外部模型</p>
</div>
<div class="stage">
  <div class="name" id="stageName">森林小径</div>
  <div class="medium" id="mediumName">水粉画 · Gouache</div>
</div>
<div class="bar">
  <div class="track"><div class="fill" id="fill"></div></div>
  <div class="labels"><span>清晨 · 林间</span><span>日落 · 海上</span></div>
</div>
<div class="steps">
  <b>流程复刻</b><br>
  ① 规划步行路线　② 代码生成地形/小径/海洋<br>
  ③ InstancedMesh 树木花草　④ 几何体拼搭樱花树/浮岛/孩子/风筝<br>
  ⑤ Shader 光束·雾气·飞鸟·萤火虫·风筝摆动<br>
  ⑥ 绘画后处理笔触　⑦ 随太阳高度 水粉→油画　⑧ 沿小径镜头巡游
</div>
<div class="hint"><kbd>Space</kbd> 暂停 / 继续　<kbd>R</kbd> 重新开始</div>

<script src="./three.min.js"></script>
<script>
(function(){
"use strict";

/* ============================================================
 * 0. 基础：渲染器 / 场景 / 相机
 * ============================================================ */
const app = document.getElementById('app');
const renderer = new THREE.WebGLRenderer({antialias:true});
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.outputColorSpace = THREE.SRGBColorSpace;
app.appendChild(renderer.domElement);

const scene = new THREE.Scene();
scene.fog = new THREE.FogExp2(0xbcd6d8, 0.011);

const camera = new THREE.PerspectiveCamera(58, window.innerWidth/window.innerHeight, 0.1, 800);

/* ============================================================
 * 1. 工具：确定性噪声 / 插值
 * ============================================================ */
function hash2(x,y){ const n = Math.sin(x*127.1 + y*311.7)*43758.5453; return n - Math.floor(n); }
function vnoise(x,y){
  const xi=Math.floor(x), yi=Math.floor(y), xf=x-xi, yf=y-yi;
  const u=xf*xf*(3-2*xf), v=yf*yf*(3-2*yf);
  const a=hash2(xi,yi), b=hash2(xi+1,yi), c=hash2(xi,yi+1), d=hash2(xi+1,yi+1);
  return a+(b-a)*u+(c-a)*v+(a-b-c+d)*u*v;
}
function fbm(x,y){ let s=0,amp=0.5,f=1; for(let i=0;i<4;i++){ s+=amp*vnoise(x*f,y*f); amp*=0.5; f*=2.1; } return s; }
function clamp(v,a,b){ return Math.max(a,Math.min(b,v)); }
function lerp(a,b,t){ return a+(b-a)*t; }
function smoothstep(a,b,x){ const t=clamp((x-a)/(b-a),0,1); return t*t*(3-2*t); }
function gauss(x,z,cx,cz,rx,rz){ const dx=(x-cx)/rx, dz=(z-cz)/rz; return Math.exp(-(dx*dx+dz*dz)); }

/* ============================================================
 * 2. 步行路线（森林小径 → 山坡 → 海边）
 * ============================================================ */
const pathControl = [
  new THREE.Vector3(-14, 0, -118),
  new THREE.Vector3(-17, 0, -82),
  new THREE.Vector3(-8,  0, -50),
  new THREE.Vector3( 5,  0, -24),
  new THREE.Vector3( 0,  0,  -2),
  new THREE.Vector3( 6,  0,  26),
  new THREE.Vector3( 2,  0,  56),
  new THREE.Vector3(-5,  0,  80),
  new THREE.Vector3( 0,  0, 102)
];
const walkCurve = new THREE.CatmullRomCurve3(pathControl, false, 'catmullrom', 0.5);
const PATH_SAMPLES = 220;
const pathPts = [];
for(let i=0;i<=PATH_SAMPLES;i++){
  const p = walkCurve.getPoint(i/PATH_SAMPLES);
  pathPts.push(new THREE.Vector2(p.x, p.z));
}
function distToPath(x,z){
  let m = 1e9;
  for(let i=0;i<pathPts.length;i+=2){
    const dx=x-pathPts[i].x, dz=z-pathPts[i].y;
    const d=dx*dx+dz*dz; if(d<m) m=d;
  }
  return Math.sqrt(m);
}

/* 地形高度：起伏 + 中央山坡 + 海岸下沉 + 小径压平 */
function baseHeight(x,z){
  let h = (fbm(x*0.018+10, z*0.018)-0.5)*10;
  h += gauss(x,z, 0,-10, 55, 20)*9;              // 开阔山坡
  const coast = smoothstep(60, 95, z);           // 向海下沉
  h = h*(1-coast*0.6) - coast*0.8;
  return h;
}
function terrainHeight(x,z){
  let h = baseHeight(x,z);
  const d = distToPath(x,z);
  // 小径处压平到路径基准高度
  const px = walkCurve.getPoint(clamp((z+118)/220,0,1)).x;
  const pathH = baseHeight(px, z)*0.6 + 1.2;
  const w = smoothstep(9, 3, d);
  return lerp(h, pathH, w);
}

/* ============================================================
 * 3. 地形网格（顶点色：草 / 土路 / 沙 / 岩）
 * ============================================================ */
const TER_W = 360, TER_D = 300, TER_SEG = 150;
const terrainGeo = new THREE.PlaneGeometry(TER_W, TER_D, TER_SEG, TER_SEG);
terrainGeo.rotateX(-Math.PI/2);
{
  const pos = terrainGeo.attributes.position;
  const colors = new Float32Array(pos.count*3);
  const cGrass = new THREE.Color(0x35702f);
  const cGrass2= new THREE.Color(0xc4e84e);
  const cDirt  = new THREE.Color(0xd9c39a);
  const cSand  = new THREE.Color(0xe8d8a6);
  const cRock  = new THREE.Color(0x6f665c);
  const tmp = new THREE.Color();
  for(let i=0;i<pos.count;i++){
    const x=pos.getX(i), z=pos.getZ(i);
    const h=terrainHeight(x,z);
    pos.setY(i,h);
    const d=distToPath(x,z);
    const n=fbm(x*0.05,z*0.05);
    tmp.copy(cGrass).lerp(cGrass2,n);
    if(h<0.9) tmp.lerp(cSand, 1.0-smoothstep(0.2,0.9,h));
    if(d<2.6) tmp.lerp(cDirt, 1.0-smoothstep(1.2,2.6,d));
    // 陡坡岩石
    const hx=terrainHeight(x+1.5,z)-h, hz=terrainHeight(x,z+1.5)-h;
    const slope=Math.sqrt(hx*hx+hz*hz);
    if(slope>1.1) tmp.lerp(cRock, smoothstep(1.1,1.8,slope));
    colors[i*3]=tmp.r; colors[i*3+1]=tmp.g; colors[i*3+2]=tmp.b;
  }
  terrainGeo.setAttribute('color', new THREE.BufferAttribute(colors,3));
  terrainGeo.computeVertexNormals();
}
const terrainMat = new THREE.MeshLambertMaterial({vertexColors:true});
const terrain = new THREE.Mesh(terrainGeo, terrainMat);
scene.add(terrain);

/* 小径 ribbon */
{
  const N=120, verts=[], idx=[];
  for(let i=0;i<=N;i++){
    const t=i/N;
    const p=walkCurve.getPoint(t);
    const tan=walkCurve.getTangent(t);
    const nx=-tan.z, nz=tan.x;
    const w=1.5;
    const y=terrainHeight(p.x,p.z)+0.14;
    verts.push(p.x+nx*w, y, p.z+nz*w,  p.x-nx*w, y, p.z-nz*w);
    if(i<N){ const a=i*2; idx.push(a,a+2,a+1, a+1,a+2,a+3); }
  }
  const g=new THREE.BufferGeometry();
  g.setAttribute('position', new THREE.Float32BufferAttribute(verts,3));
  g.setIndex(idx); g.computeVertexNormals();
  const m=new THREE.MeshLambertMaterial({color:0xd9c39a, side:THREE.DoubleSide});
  scene.add(new THREE.Mesh(g,m));
}

/* ============================================================
 * 4. 海洋（自定义 Shader：波纹 + 日落反光）
 * ============================================================ */
const seaUniforms = {
  uTime:{value:0}, uDay:{value:1},
  uSunDir:{value:new THREE.Vector3(0,0.3,1)}
};
const sea = new THREE.Mesh(
  new THREE.PlaneGeometry(700, 300, 1, 1),
  new THREE.ShaderMaterial({
    uniforms: seaUniforms,
    vertexShader:`
      varying vec2 vUv; varying vec3 vWorld; varying vec3 vView;
      void main(){ vUv=uv; vec4 w=modelMatrix*vec4(position,1.0); vWorld=w.xyz;
        vView=cameraPosition-w.xyz;
        gl_Position=projectionMatrix*viewMatrix*w; }`,
    fragmentShader:`
      uniform float uTime; uniform float uDay; uniform vec3 uSunDir;
      varying vec2 vUv; varying vec3 vWorld; varying vec3 vView;
      void main(){
        vec3 deepDay=vec3(0.12,0.45,0.52), shallowDay=vec3(0.35,0.74,0.70);
        vec3 deepSet=vec3(0.34,0.14,0.32), shallowSet=vec3(0.88,0.45,0.38);
        vec3 deep=mix(deepSet,deepDay,uDay), shallow=mix(shallowSet,shallowDay,uDay);
        float rip = sin(vWorld.x*0.35+uTime*1.2)*sin(vWorld.z*0.3-uTime*0.9);
        float m = smoothstep(-1.0,1.0,rip)*0.5+0.5;
        vec3 col=mix(deep,shallow,m*0.6);
        // 太阳反光带
        vec3 viewDir=normalize(vView);
        float spec=pow(max(dot(reflect(-uSunDir,vec3(0,1,0)),viewDir),0.0),120.0);
        col+=vec3(1.0,0.82,0.55)*spec*mix(0.08,0.55,1.0-uDay);
        gl_FragColor=vec4(col,1.0);
      }`
  })
);
sea.rotation.x=-Math.PI/2;
sea.position.set(0, 0.15, 250);
scene.add(sea);

/* ============================================================
 * 5. 天空穹顶（随太阳高度变色 + 太阳光盘）
 * ============================================================ */
const skyUniforms = {
  uDay:{value:1}, uSunDir:{value:new THREE.Vector3(0,0.3,1)}
};
const sky = new THREE.Mesh(
  new THREE.SphereGeometry(420, 32, 16),
  new THREE.ShaderMaterial({
    uniforms: skyUniforms, side:THREE.BackSide, depthWrite:false,
    vertexShader:`varying vec3 vDir; void main(){ vDir=normalize(position);
      gl_Position=projectionMatrix*modelViewMatrix*vec4(position,1.0); }`,
    fragmentShader:`
      uniform float uDay; uniform vec3 uSunDir; varying vec3 vDir;
      float hash(vec2 p){return fract(sin(dot(p,vec2(127.1,311.7)))*43758.5);}
      float noise(vec2 p){vec2 i=floor(p),f=fract(p);vec2 u=f*f*(3.-2.*f);
        float a=hash(i),b=hash(i+vec2(1,0)),c=hash(i+vec2(0,1)),d=hash(i+vec2(1,1));
        return mix(mix(a,b,u.x),mix(c,d,u.x),u.y);}
      void main(){
        vec3 zenDay=vec3(0.18,0.42,0.86), horDay=vec3(0.62,0.80,0.94);
        vec3 zenSet=vec3(0.30,0.17,0.46), horSet=vec3(1.0,0.55,0.34);
        vec3 zen=mix(zenSet,zenDay,uDay), hor=mix(horSet,horDay,uDay);
        float h=clamp(vDir.y*1.5+0.12,0.0,1.0);
        vec3 col=mix(hor,zen,h);
        // 笔触云块（大块方向性笔刷）
        vec2 cuv=vDir.xz/(0.25+abs(vDir.y));
        float cl=noise(cuv*1.3+3.0)*0.65+noise(cuv*2.7+7.0)*0.35;
        vec3 cloudDay=vec3(0.94,0.96,1.0), cloudSet=vec3(1.0,0.62,0.60);
        vec3 cloud=mix(cloudSet,cloudDay,uDay);
        float cm=smoothstep(0.5,0.8,cl)*smoothstep(0.04,0.3,vDir.y);
        col=mix(col,cloud,cm*mix(0.55,0.4,uDay));
        // 黄昏星星
        float star=step(0.997,hash(floor(vDir.xz*220.0)));
        col+=vec3(1.0,0.95,0.85)*star*smoothstep(0.4,0.0,uDay)*smoothstep(0.1,0.4,vDir.y);
        float sun=max(dot(normalize(vDir),normalize(uSunDir)),0.0);
        col+=vec3(1.0,0.86,0.62)*pow(sun,380.0)*0.55;
        col+=vec3(1.0,0.62,0.36)*pow(sun,24.0)*0.10;
        gl_FragColor=vec4(col,1.0);
      }`
  })
);
scene.add(sky);

/* ============================================================
 * 6. 灯光
 * ============================================================ */
const hemi = new THREE.HemisphereLight(0xcfe8ef, 0x6f9e4f, 0.8);
scene.add(hemi);
const ambient = new THREE.AmbientLight(0xfff2e0, 0.4);
scene.add(ambient);
const sunLight = new THREE.DirectionalLight(0xfff2dd, 1.1);
scene.add(sunLight);
scene.add(sunLight.target);

/* ============================================================
 * 7. InstancedMesh：松树 / 草 / 花
 * ============================================================ */
const dummy = new THREE.Object3D();
const tmpColor = new THREE.Color();

function scatterPoint(minH, maxZ, nearPathClear){
  for(let k=0;k<40;k++){
    const x=(Math.random()-0.5)*TER_W*0.9;
    const z=(Math.random()-0.5)*TER_D*0.9;
    const h=terrainHeight(x,z);
    if(h<minH || z>maxZ) continue;
    if(distToPath(x,z)<nearPathClear) continue;
    return {x,z,h};
  }
  return null;
}

/* 阔叶树：高树干 + 双层圆冠（深绿冠身 / 嫩绿受光面） */
const PINE_N = 340;
const trunkMesh = new THREE.InstancedMesh(new THREE.CylinderGeometry(0.18,0.3,2.3,5),
  new THREE.MeshLambertMaterial({color:0x5a3f2c}), PINE_N);
const leafMesh = new THREE.InstancedMesh(new THREE.IcosahedronGeometry(1.5,1),
  new THREE.MeshLambertMaterial({color:0x4d8a40}), PINE_N);
const leafMesh2 = new THREE.InstancedMesh(new THREE.IcosahedronGeometry(1.0,1),
  new THREE.MeshLambertMaterial({color:0x9ed84a}), PINE_N);
let pi=0;
for(let i=0;i<PINE_N;i++){
  const p=scatterPoint(0.4, 78, 4.0); if(!p) continue;
  const s=0.9+Math.random()*1.1;
  dummy.position.set(p.x,p.h+1.15*s,p.z);
  dummy.scale.setScalar(s); dummy.rotation.y=Math.random()*Math.PI*2;
  dummy.updateMatrix(); trunkMesh.setMatrixAt(pi,dummy.matrix);
  dummy.position.y=p.h+2.7*s; dummy.updateMatrix(); leafMesh.setMatrixAt(pi,dummy.matrix);
  dummy.position.set(p.x+0.3*s,p.h+3.6*s,p.z-0.2*s); dummy.updateMatrix(); leafMesh2.setMatrixAt(pi,dummy.matrix);
  tmpColor.setHSL(0.30+Math.random()*0.05, 0.5, 0.46+Math.random()*0.12);
  leafMesh.setColorAt(pi,tmpColor);
  tmpColor.setHSL(0.22+Math.random()*0.06, 0.62, 0.5+Math.random()*0.14);
  leafMesh2.setColorAt(pi,tmpColor);
  pi++;
}
trunkMesh.count=leafMesh.count=leafMesh2.count=pi;
scene.add(trunkMesh, leafMesh, leafMesh2);

/* 草 */
const GRASS_N = 2200;
const grassMesh = new THREE.InstancedMesh(new THREE.ConeGeometry(0.07,0.6,3),
  new THREE.MeshLambertMaterial({color:0xa8d84a}), GRASS_N);
let gi=0;
for(let i=0;i<GRASS_N;i++){
  const p=scatterPoint(0.3, 88, 2.2); if(!p) continue;
  const s=0.6+Math.random()*1.0;
  dummy.position.set(p.x,p.h+0.25*s,p.z);
  dummy.scale.set(s,s*(0.8+Math.random()*0.6),s);
  dummy.rotation.y=Math.random()*Math.PI;
  dummy.updateMatrix(); grassMesh.setMatrixAt(gi,dummy.matrix);
  tmpColor.setHSL(0.21+Math.random()*0.08,0.62,0.48+Math.random()*0.18);
  grassMesh.setColorAt(gi,tmpColor);
  gi++;
}
grassMesh.count=gi; scene.add(grassMesh);

/* 花：茎 + 花冠 */
const FLOWER_N = 420;
const stemMesh = new THREE.InstancedMesh(new THREE.CylinderGeometry(0.02,0.02,0.4,4),
  new THREE.MeshLambertMaterial({color:0x55803a}), FLOWER_N);
const bloomMesh = new THREE.InstancedMesh(new THREE.IcosahedronGeometry(0.13,0),
  new THREE.MeshLambertMaterial({color:0xffffff}), FLOWER_N);
const flowerPalette=[0xe86a9a,0xf6a8c8,0xf3d98b,0xc9a7e8,0xf68a5a,0xff5e7a,0xffb347];
let fi=0;
for(let i=0;i<FLOWER_N;i++){
  const p=scatterPoint(0.4, 86, 3.0); if(!p) continue;
  dummy.position.set(p.x,p.h+0.2,p.z); dummy.scale.setScalar(1);
  dummy.rotation.set(0,Math.random()*Math.PI,0); dummy.updateMatrix();
  stemMesh.setMatrixAt(fi,dummy.matrix);
  dummy.position.y=p.h+0.45; dummy.updateMatrix();
  bloomMesh.setMatrixAt(fi,dummy.matrix);
  tmpColor.setHex(flowerPalette[Math.floor(Math.random()*flowerPalette.length)]);
  bloomMesh.setColorAt(fi,tmpColor);
  fi++;
}
stemMesh.count=bloomMesh.count=fi; scene.add(stemMesh,bloomMesh);

/* ============================================================
 * 8. 主角道具：樱花树 / 浮岛 / 孩子 / 风筝（基础几何体）
 * ============================================================ */
/* 樱花树（山坡顶） */
function blossomTree(x,z){
  const g=new THREE.Group();
  const h=terrainHeight(x,z);
  const trunk=new THREE.Mesh(new THREE.CylinderGeometry(0.25,0.4,2.6,6),
    new THREE.MeshLambertMaterial({color:0x5e4030}));
  trunk.position.y=1.3; g.add(trunk);
  const blobs=[[0,3.0,0,2.4],[1.7,2.7,0.4,1.8],[-1.6,2.8,-0.3,1.9],[0.5,3.9,-0.6,1.7],[-0.6,3.6,0.7,1.6],[1.1,3.5,-0.9,1.4],[-1.3,3.4,0.6,1.4],[0.2,4.4,0.2,1.5]];
  blobs.forEach((b,i)=>{
    const col=i%2?0xf27bb0:0xd84f86;
    const m=new THREE.Mesh(new THREE.IcosahedronGeometry(b[3],1),
      new THREE.MeshLambertMaterial({color:col, emissive:col, emissiveIntensity:0.3}));
    m.position.set(b[0],b[1],b[2]); g.add(m);
  });
  g.scale.setScalar(2.3);
  g.position.set(x,h,z);
  scene.add(g); return g;
}
blossomTree(12,88);

/* 浮岛 */
const islands=[];
function floatingIsland(x,y,z,s){
  const g=new THREE.Group();
  const rock=new THREE.Mesh(new THREE.ConeGeometry(3*s,3.5*s,7),
    new THREE.MeshLambertMaterial({color:0x9a7460}));
  rock.rotation.x=Math.PI; rock.position.y=-1.4*s; g.add(rock);
  const top=new THREE.Mesh(new THREE.CylinderGeometry(3*s,2.6*s,0.5*s,7),
    new THREE.MeshLambertMaterial({color:0x5f9448}));
  top.position.y=0.1*s; g.add(top);
  const mini=new THREE.Mesh(new THREE.ConeGeometry(0.8*s,1.8*s,6),
    new THREE.MeshLambertMaterial({color:0x3f7040}));
  mini.position.y=1.3*s; g.add(mini);
  g.position.set(x,y,z);
  g.userData={baseY:y, phase:Math.random()*Math.PI*2, speed:0.4+Math.random()*0.3};
  scene.add(g); islands.push(g); return g;
}
floatingIsland(-28,11,104,1.2);
floatingIsland(0,13,114,0.9);
floatingIsland(26,11,108,1.0);

/* 孩子 */
const kid=new THREE.Group();
{
  const skin=new THREE.MeshLambertMaterial({color:0xe8b98f, emissive:0xe8b98f, emissiveIntensity:0.12});
  const cloth=new THREE.MeshLambertMaterial({color:0x3f6fb0, emissive:0x3f6fb0, emissiveIntensity:0.15});
  const body=new THREE.Mesh(new THREE.CylinderGeometry(0.32,0.38,0.9,8),cloth);
  body.position.y=0.85; kid.add(body);
  const head=new THREE.Mesh(new THREE.SphereGeometry(0.28,10,8),skin);
  head.position.y=1.55; kid.add(head);
  const hat=new THREE.Mesh(new THREE.ConeGeometry(0.3,0.35,8),
    new THREE.MeshLambertMaterial({color:0xd8c27a}));
  hat.position.y=1.85; kid.add(hat);
  const legL=new THREE.Mesh(new THREE.CylinderGeometry(0.09,0.09,0.5,6),
    new THREE.MeshLambertMaterial({color:0x4a3b30}));
  legL.position.set(-0.14,0.25,0); kid.add(legL);
  const legR=legL.clone(); legR.position.x=0.14; kid.add(legR);
  const armL=new THREE.Mesh(new THREE.CylinderGeometry(0.07,0.07,0.6,6),skin);
  armL.position.set(-0.4,1.0,0); armL.rotation.z=0.5; kid.add(armL);
  const armR=armL.clone(); armR.position.x=0.4; armR.rotation.z=-0.9; kid.add(armR);
}
const kidX=-3.0, kidZ=96;
kid.position.set(kidX, Math.max(terrainHeight(kidX,kidZ),1.0), kidZ);
kid.rotation.y=Math.PI;
scene.add(kid);

/* 风筝 + 线 */
const kite=new THREE.Group();
{
  const shape=new THREE.BufferGeometry();
  const v=new Float32Array([0,0.7,0,  -0.5,0,0,  0,-0.7,0,  0.5,0,0]);
  shape.setAttribute('position',new THREE.BufferAttribute(v,3));
  shape.setIndex([0,1,2, 0,2,3]);
  shape.computeVertexNormals();
  const kmat=new THREE.MeshLambertMaterial({color:0xe8564a,side:THREE.DoubleSide});
  kite.add(new THREE.Mesh(shape,kmat));
  const tail=new THREE.Mesh(new THREE.CylinderGeometry(0.02,0.02,1.0,4),
    new THREE.MeshLambertMaterial({color:0xe8564a}));
  tail.position.y=-1.1; kite.add(tail);
}
scene.add(kite);
const kiteLineGeo=new THREE.BufferGeometry();
kiteLineGeo.setAttribute('position',new THREE.BufferAttribute(new Float32Array(9),3));
const kiteLine=new THREE.Line(kiteLineGeo,
  new THREE.LineBasicMaterial({color:0x3a2f28,transparent:true,opacity:0.8}));
scene.add(kiteLine);

/* ============================================================
 * 9. 飞鸟（双翅扇动，绕圈盘旋）
 * ============================================================ */
const birds=[];
{
  const wingMat=new THREE.MeshLambertMaterial({color:0x2c2a33,side:THREE.DoubleSide});
  for(let i=0;i<12;i++){
    const b=new THREE.Group();
    const wL=new THREE.Mesh(new THREE.BoxGeometry(0.55,0.02,0.2),wingMat);
    wL.position.x=-0.28; wL.geometry.translate(0.28,0,0);
    const wR=new THREE.Mesh(new THREE.BoxGeometry(0.55,0.02,0.2),wingMat);
    wR.position.x=0.28; wR.geometry.translate(-0.28,0,0);
    b.add(wL,wR);
    b.userData={r:40+Math.random()*35, h:22+Math.random()*14,
      sp:0.15+Math.random()*0.15, ph:Math.random()*Math.PI*2, wL,wR};
    scene.add(b); birds.push(b);
  }
}

/* ============================================================
 * 10. 萤火虫（黄昏亮起， additive 光点）
 * ============================================================ */
const FF_N=120;
const ffPos=new Float32Array(FF_N*3);
const ffBase=[];
for(let i=0;i<FF_N;i++){
  const x=(Math.random()-0.5)*90, z=-30+Math.random()*80;
  const y=1+Math.random()*3.5;
  ffBase.push({x,y,z,ph:Math.random()*Math.PI*2});
  ffPos[i*3]=x; ffPos[i*3+1]=y; ffPos[i*3+2]=z;
}
const ffGeo=new THREE.BufferGeometry();
ffGeo.setAttribute('position',new THREE.BufferAttribute(ffPos,3));
const ffMat=new THREE.PointsMaterial({color:0xffe29a,size:0.22,transparent:true,
  opacity:0,blending:THREE.AdditiveBlending,depthWrite:false});
const fireflies=new THREE.Points(ffGeo,ffMat);
scene.add(fireflies);

/* 白天飘飞的花瓣 / 光点（始终在场，黄昏转弱） */
const PT_N=90;
const ptPos=new Float32Array(PT_N*3);
const ptBase=[];
for(let i=0;i<PT_N;i++){
  const x=(Math.random()-0.5)*90, z=-30+Math.random()*85;
  const y=1.5+Math.random()*5;
  ptBase.push({x,y,z,ph:Math.random()*Math.PI*2});
  ptPos[i*3]=x; ptPos[i*3+1]=y; ptPos[i*3+2]=z;
}
const ptGeo=new THREE.BufferGeometry();
ptGeo.setAttribute('position',new THREE.BufferAttribute(ptPos,3));
const ptMat=new THREE.PointsMaterial({color:0xfff2f2,size:0.15,transparent:true,
  opacity:0.32,blending:THREE.AdditiveBlending,depthWrite:false});
const petals=new THREE.Points(ptGeo,ptMat);
scene.add(petals);

/* ============================================================
 * 11. 光束（god rays，加色混合面片）
 * ============================================================ */
const rays=[];
{
  const rayMat=new THREE.ShaderMaterial({
    transparent:true,blending:THREE.AdditiveBlending,depthWrite:false,side:THREE.DoubleSide,
    uniforms:{uTime:{value:0},uSun:{value:1}},
    vertexShader:`varying vec2 vUv; void main(){ vUv=uv;
      gl_Position=projectionMatrix*modelViewMatrix*vec4(position,1.0); }`,
    fragmentShader:`
      uniform float uTime; uniform float uSun; varying vec2 vUv;
      float hash(vec2 p){return fract(sin(dot(p,vec2(127.1,311.7)))*43758.5);}
      void main(){
        float streak=smoothstep(0.0,0.6,vUv.x)*(1.0-smoothstep(0.4,1.0,vUv.x));
        float vert=smoothstep(0.0,0.3,vUv.y)*(1.0-smoothstep(0.5,1.0,vUv.y));
        float n=hash(vec2(floor(vUv.x*6.0),floor(uTime*0.3)));
        float a=streak*vert*(0.5+0.5*n)*0.13*uSun;
        gl_FragColor=vec4(1.0,0.9,0.7,a);
      }`
  });
  for(let i=0;i<5;i++){
    const m=new THREE.Mesh(new THREE.PlaneGeometry(5,38),rayMat.clone());
    m.position.set(-26+i*11, 20, -40+i*13);
    m.rotation.z=0.3; m.rotation.y=0.2;
    scene.add(m); rays.push(m);
  }
}

/* 地面雾气面片 */
const fogPlanes=[];
{
  const fogMat=new THREE.ShaderMaterial({
    transparent:true,depthWrite:false,side:THREE.DoubleSide,
    uniforms:{uTime:{value:0},uDay:{value:1}},
    vertexShader:`varying vec2 vUv; void main(){vUv=uv;
      gl_Position=projectionMatrix*modelViewMatrix*vec4(position,1.0);}`,
    fragmentShader:`
      uniform float uTime; uniform float uDay; varying vec2 vUv;
      float hash(vec2 p){return fract(sin(dot(p,vec2(127.1,311.7)))*43758.5);}
      float noise(vec2 p){vec2 i=floor(p),f=fract(p);vec2 u=f*f*(3.-2.*f);
        float a=hash(i),b=hash(i+vec2(1,0)),c=hash(i+vec2(0,1)),d=hash(i+vec2(1,1));
        return mix(mix(a,b,u.x),mix(c,d,u.x),u.y);}
      void main(){
        float n=noise(vUv*3.0+uTime*0.05);
        float edge=smoothstep(0.0,0.3,vUv.x)*(1.0-smoothstep(0.7,1.0,vUv.x))
                  *smoothstep(0.0,0.3,vUv.y)*(1.0-smoothstep(0.7,1.0,vUv.y));
        float a=smoothstep(0.45,0.8,n)*edge*mix(0.10,0.22,1.0-uDay);
        vec3 col=mix(vec3(0.9,0.6,0.5),vec3(0.85,0.9,0.9),uDay);
        gl_FragColor=vec4(col,a);
      }`
  });
  for(let i=0;i<4;i++){
    const m=new THREE.Mesh(new THREE.PlaneGeometry(60,26),fogMat.clone());
    m.rotation.x=-Math.PI/2;
    m.position.set(-30+i*20, 2.5+Math.random()*2, -20+i*22);
    scene.add(m); fogPlanes.push(m);
  }
}

/* ============================================================
 * 12. 绘画后处理：RenderTarget + 笔触 Shader（水粉 ↔ 油画）
 * ============================================================ */
let rt=new THREE.WebGLRenderTarget(window.innerWidth, window.innerHeight,{samples:4});
const postScene=new THREE.Scene();
const postCam=new THREE.OrthographicCamera(-1,1,1,-1,0,1);
const postUniforms={
  tDiffuse:{value:rt.texture},
  uDay:{value:1}, uTime:{value:0}, uRes:{value:new THREE.Vector2(window.innerWidth,window.innerHeight)}
};
const postMat=new THREE.ShaderMaterial({
  uniforms:postUniforms,
  vertexShader:`varying vec2 vUv; void main(){vUv=uv;
    gl_Position=vec4(position.xy,0.0,1.0);}`,
  fragmentShader:`
    uniform sampler2D tDiffuse; uniform float uDay; uniform float uTime;
    uniform vec2 uRes; varying vec2 vUv;
    float hash(vec2 p){return fract(sin(dot(p,vec2(127.1,311.7)))*43758.5);}
    float noise(vec2 p){vec2 i=floor(p),f=fract(p);vec2 u=f*f*(3.-2.*f);
      float a=hash(i),b=hash(i+vec2(1,0)),c=hash(i+vec2(0,1)),d=hash(i+vec2(1,1));
      return mix(mix(a,b,u.x),mix(c,d,u.x),u.y);}
    void main(){
      vec2 uv=vUv;
      vec3 col=texture2D(tDiffuse,uv).rgb;
      col=pow(max(col,vec3(0.0)),vec3(0.4545));  // 线性 → sRGB 显示空间
      float oil=1.0-uDay;                 // 1=油画 0=水粉

      // 笔触方向与笔刷大小：水粉平涂、油画斜向厚涂
      float ang=mix(0.12,0.75,oil);
      vec2 dir=vec2(cos(ang),sin(ang));
      float cell=mix(95.0,52.0,oil);
      float n=noise(uv*uRes/cell*1.4+fract(uTime)*0.1);

      // 颜色阶数：水粉亮色块面多，油画大色块少
      float levels=mix(6.0,4.0,oil);
      vec3 q=floor(col*levels+0.5)/levels;

      // 油画：沿笔触方向涂抹（厚涂肌理）
      vec3 smear=texture2D(tDiffuse,uv+dir*0.0045*oil).rgb;
      q=mix(q,floor(smear*levels+0.5)/levels,oil*0.5);

      // 边缘压暗（邻域梯度，油画轮廓更重，保留最低亮度避免压死黑）
      vec3 cx=texture2D(tDiffuse,uv+vec2(1.5/uRes.x,0.0)).rgb;
      vec3 cy=texture2D(tDiffuse,uv+vec2(0.0,1.5/uRes.y)).rgb;
      float g=length(cx-col)+length(cy-col);
      q-=g*mix(0.08,0.18,oil);
      q=max(q,vec3(0.08));

      // 颗粒 / 颜料肌理
      float grain=hash(uv*uRes+fract(uTime)*10.0);
      q+=(grain-0.5)*mix(0.05,0.13,oil);

      // 日落暖调
      q=mix(q,q*vec3(1.09,0.94,0.83),oil*0.6);

      // 暗角
      float d=distance(uv,vec2(0.5));
      q*=1.0-smoothstep(0.42,0.98,d);

      gl_FragColor=vec4(q,1.0);
    }`
});
postScene.add(new THREE.Mesh(new THREE.PlaneGeometry(2,2),postMat));

/* ============================================================
 * 13. 时间 / 太阳 / 动画循环
 * ============================================================ */
const WALK_DURATION=90;          // 一次漫步秒数
let walkT=0, paused=false, elapsed=0, last=performance.now();

const stageName=document.getElementById('stageName');
const mediumName=document.getElementById('mediumName');
const fill=document.getElementById('fill');

function updateSun(p){
  // 太阳高度角：正午 52° → 日落 7°
  const elev=lerp(52,7,p)*Math.PI/180;
  const azim=Math.PI/2 - 0.45;   // 朝海方向 (+z，偏右)
  const dir=new THREE.Vector3(
    Math.cos(elev)*Math.cos(azim), Math.sin(elev), Math.cos(elev)*Math.sin(azim));
  sunLight.position.copy(dir.clone().multiplyScalar(120));
  skyUniforms.uSunDir.value.copy(dir);
  seaUniforms.uSunDir.value.copy(dir);

  const day=1-smoothstep(0.35,0.9,p); // 1 白天 0 日落：山坡前保持水粉，临近海面才转油画
  skyUniforms.uDay.value=day;
  seaUniforms.uDay.value=day;
  postUniforms.uDay.value=day;
  ffMat.opacity=Math.pow(1-day,1.6)*1.0;
  ptMat.opacity=lerp(0.32,0.16,1-day);
  rays.forEach(r=>r.material.uniforms.uSun.value=day<0.5?1.0:0.55);

  // 灯光颜色 / 强度
  sunLight.color.setHSL(lerp(0.07,0.0,1-day), lerp(0.25,0.85,1-day), lerp(0.8,0.62,1-day));
  sunLight.intensity=lerp(0.75,1.35,day);
  hemi.color.setHSL(0.55, lerp(0.22,0.1,1-day), lerp(0.8,0.7,1-day));
  hemi.groundColor.setHSL(0.25,0.25,lerp(0.45,0.5,day));
  hemi.intensity=lerp(0.7,1.15,day);
  ambient.intensity=lerp(0.5,0.4,day);
  scene.fog.color.setHSL(lerp(0.05,0.55,day), lerp(0.2,0.16,1-day), lerp(0.66,0.78,day));
  scene.fog.density=lerp(0.009,0.0045,day);

  // UI
  if(p<0.35) stageName.textContent='森林小径';
  else if(p<0.7) stageName.textContent='开阔山坡';
  else stageName.textContent='海边日落';
  mediumName.textContent = day>0.55 ? '水粉画 · Gouache' : '油画 · Oil Paint';
  fill.style.width=(p*100).toFixed(1)+'%';
  return day;
}

function animate(now){
  requestAnimationFrame(animate);
  const nowMs=performance.now();
  let dt=Math.max(0,(nowMs-last)/1000); last=nowMs;
  if(!paused){ elapsed+=dt; }
  walkT=clamp(((elapsed%WALK_DURATION)+WALK_DURATION)%WALK_DURATION,0,WALK_DURATION)/WALK_DURATION;
  const t=elapsed;

  const day=updateSun(walkT);

  // 相机沿小径巡游
  const camP=walkCurve.getPoint(walkT);
  camP.y=terrainHeight(camP.x,camP.z)+2.6+Math.sin(t*1.5)*0.08;
  const lookP=walkCurve.getPoint(clamp(walkT+0.06,0,1));
  lookP.y=terrainHeight(lookP.x,lookP.z)+1.6;
  camera.position.copy(camP);
  camera.lookAt(lookP);

  // 浮岛漂浮
  islands.forEach(is=>{
    is.position.y=is.userData.baseY+Math.sin(t*is.userData.speed+is.userData.phase)*0.7;
    is.rotation.y=Math.sin(t*0.2+is.userData.phase)*0.1;
  });

  // 风筝摆动 + 线
  const kx=kidX+1.6+Math.sin(t*0.9)*1.2;
  const ky=terrainHeight(kidX,kidZ)+7.5+Math.sin(t*0.7)*0.6;
  const kz=kidZ+3.0+Math.cos(t*0.8)*0.8;
  kite.position.set(kx,ky,kz);
  kite.rotation.z=Math.sin(t*0.9)*0.25;
  const hand=new THREE.Vector3(kidX+0.35, terrainHeight(kidX,kidZ)+1.1, kidZ);
  const pos=kiteLineGeo.attributes.position.array;
  for(let i=0;i<=2;i++){
    const s=i/2;
    const px=lerp(hand.x,kx,s), py=lerp(hand.y,ky,s)-Math.sin(s*Math.PI)*0.4;
    const pz=lerp(hand.z,kz,s);
    pos[i*3]=px; pos[i*3+1]=py; pos[i*3+2]=pz;
  }
  kiteLineGeo.attributes.position.needsUpdate=true;

  // 飞鸟盘旋 + 扇翅
  birds.forEach(b=>{
    const u=b.userData;
    const a=t*u.sp+u.ph;
    b.position.set(Math.cos(a)*u.r, u.h+Math.sin(t+u.ph)*2, 10+Math.sin(a)*u.r*0.7);
    b.rotation.y=-a;
    const flap=Math.sin(t*9+u.ph)*0.55;
    u.wL.rotation.z=flap; u.wR.rotation.z=-flap;
  });

  // 萤火虫漂移
  const fa=ffGeo.attributes.position.array;
  for(let i=0;i<FF_N;i++){
    const b=ffBase[i];
    fa[i*3]=b.x+Math.sin(t*0.6+b.ph)*1.5;
    fa[i*3+1]=b.y+Math.sin(t*0.8+b.ph*1.3)*0.6;
    fa[i*3+2]=b.z+Math.cos(t*0.5+b.ph)*1.5;
  }
  ffGeo.attributes.position.needsUpdate=true;

  // 花瓣 / 光点漂移
  const pa=ptGeo.attributes.position.array;
  for(let i=0;i<PT_N;i++){
    const b=ptBase[i];
    pa[i*3]=b.x+Math.sin(t*0.4+b.ph)*2.0;
    pa[i*3+1]=b.y+Math.sin(t*0.5+b.ph*1.3)*0.8;
    pa[i*3+2]=b.z+Math.cos(t*0.3+b.ph)*1.6;
  }
  ptGeo.attributes.position.needsUpdate=true;

  // 光束 / 雾气时间
  rays.forEach(r=>r.material.uniforms.uTime.value=t);
  fogPlanes.forEach(f=>{f.material.uniforms.uTime.value=t; f.material.uniforms.uDay.value=day;});
  seaUniforms.uTime.value=t;
  postUniforms.uTime.value=t;

  // 后处理：先渲染到 RT，再绘画 pass 上屏
  renderer.setRenderTarget(rt);
  renderer.render(scene,camera);
  renderer.setRenderTarget(null);
  renderer.render(postScene,postCam);
}
requestAnimationFrame(animate);

/* ============================================================
 * 14. 交互 / 自适应
 * ============================================================ */
window.addEventListener('keydown',e=>{
  if(e.code==='Space'){ paused=!paused; e.preventDefault(); }
  if(e.code==='KeyR'){ elapsed=0; walkT=0; paused=false; }
});
window.addEventListener('resize',()=>{
  camera.aspect=window.innerWidth/window.innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(window.innerWidth,window.innerHeight);
  rt.setSize(window.innerWidth,window.innerHeight);
  postUniforms.uRes.value.set(window.innerWidth,window.innerHeight);
});

})();
</script>
</body>
</html>
